{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My List - Biggie Movies</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<h1 style="text-align:center; margin:30px 0;">
    ❤️ My List
</h1>

<div class="movie-grid">

{% for movie in movies %}

<div class="movie-card">

    <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">

    <h3>{{ movie.title }}</h3>

    <p>⭐ {{ movie.rating }}/10</p>

    <p>{{ movie.category }} • {{ movie.release_year }}</p>

    <a href="{% url 'movie_detail' movie.id %}">
        <button>▶ Watch Now</button>
    </a>

</div>

{% empty %}

<h3 style="text-align:center;">
You haven't added any movies to your list yet.
</h3>

{% endfor %}

</div>

</body>
</html>
